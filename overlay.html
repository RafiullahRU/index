<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
/* --g = gap under the score bar. Smaller = closer to the bottom (try 0.3 to 1.2). Test with overlay.html?gap=0.5 */
:root{--u:min(1vw,1.15vh);--g:calc(var(--u)*0.8);--c1:#00d2ff;--c2:#00ff88;--hot:#ff3b5c;--gold:#ffc83d;--vio:#8a2be2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{ width:100%;height:100%;background:transparent;overflow:hidden;color:#fff;
  font-family:-apple-system,"SF Pro Display",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#dbg{position:absolute;left:4px;top:40%;font:12px monospace;color:#0f0;background:rgba(0,0,0,.6);padding:2px 6px;display:none;z-index:99}

/* ---------- TOP ---------- */
#top{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3);right:calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*2)}
#live{display:none;align-items:center;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1) calc(var(--u)*2.4);
  border-radius:999px;font-weight:900;letter-spacing:.12em;font-size:calc(var(--u)*3);
  background:linear-gradient(135deg,#ff2d55,#b00020);box-shadow:0 0 calc(var(--u)*4) rgba(255,45,85,.7)}
#live.on{display:flex}
#live i{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:#fff;animation:blink 1s infinite}

/* ---------- APP ICON (top right) ---------- */
/* Same rule for portrait AND landscape (landscape only makes it a bit smaller).
   It starts hidden and is shown by the script once the image has really loaded.
   Change the size here (units of u). Move it with top / right. */
#logo,#logoFb{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*3);
  width:calc(var(--u)*11);height:calc(var(--u)*11);object-fit:contain;display:none;
  background:transparent;border:0;box-shadow:none;
  pointer-events:none;z-index:60}
body.land #logo,body.land #logoFb{width:calc(var(--u)*9);height:calc(var(--u)*9);top:calc(var(--u)*2.5)}
#logoFb{display:none}#logoFb svg{width:100%;height:100%;display:block}

/* ---------- SCORE BAR (always bottom) ---------- */
#dock{position:absolute;left:calc(var(--u)*3 + var(--sx,0px));right:calc(var(--u)*3 - var(--sx,0px));bottom:var(--g);
  display:flex;justify-content:center;animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
#bar{margin-bottom:8vh; /* PORTRAIT: high margin, bar sits higher above the bottom edge */ position:relative;width:90%;max-width:calc(var(--u)*118);display:grid;grid-template-columns:1.3fr 1.05fr .95fr;align-items:center;gap:calc(var(--u)*1);
  padding:calc(var(--u)*.9) calc(var(--u)*1.8) calc(var(--u)*.8);border-radius:calc(var(--u)*3);
  background:linear-gradient(135deg,rgba(6,10,26,.93),rgba(24,10,54,.93));
  border:calc(var(--u)*.3) solid rgba(0,210,255,.5);
  box-shadow:0 0 calc(var(--u)*5) rgba(0,210,255,.35),0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.6);overflow:hidden}
#bar:before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*.4);
  background:linear-gradient(90deg,var(--c1),var(--vio),var(--c2),var(--c1));background-size:300% 100%;animation:slide 3s linear infinite}
#bar:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);opacity:0}
#bar.surge{animation:surge 1s ease-out}
#bar.surge:after{animation:sweep .9s ease-out}
#bar.shake{animation:shake .8s ease-out}
.col{min-width:0}
.bat{display:flex;align-items:center;gap:calc(var(--u)*.6);padding:calc(var(--u)*.1) calc(var(--u)*.8);
  border-radius:calc(var(--u)*1);font-size:calc(var(--u)*2.1);white-space:nowrap;transition:background .4s}
.bat.strike{background:linear-gradient(90deg,rgba(0,210,255,.28),rgba(0,210,255,0))}
.bat .dot{width:calc(var(--u)*1.1);color:var(--c1);font-size:calc(var(--u)*1.4)}
.bat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bat .rn{display:inline-block;font-weight:900;color:var(--c1);font-size:calc(var(--u)*2.5)}
.bat .bl{color:#9aa6bd;font-size:calc(var(--u)*1.6)}
.mid{text-align:center}
.score{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2)}
.tm{font-weight:900;font-size:calc(var(--u)*2.8);color:var(--c1);letter-spacing:.06em;text-shadow:0 0 calc(var(--u)*2) rgba(0,210,255,.8)}
.sep{width:calc(var(--u)*.3);height:calc(var(--u)*3.2);background:linear-gradient(var(--c1),var(--vio));border-radius:2px}
.sc{display:inline-block;font-weight:900;font-size:calc(var(--u)*4.2);line-height:1;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*2) rgba(0,0,0,.6)}
.rates{display:flex;justify-content:center;gap:calc(var(--u)*2.4);margin-top:calc(var(--u)*.2);font-size:calc(var(--u)*1.9);font-weight:800}
.rates span{display:inline-block}
.rates span b{color:#9aa6bd;font-size:calc(var(--u)*1.5);margin-right:calc(var(--u)*.8);letter-spacing:.08em}
.rates .crr{color:var(--c1)} .rates .rrr{color:#ff7a3d}
.bowl{text-align:right;white-space:nowrap}
.bowl .lbl{display:none}
.bowl .bn{display:inline-block;max-width:58%;vertical-align:middle;font-weight:800;font-size:calc(var(--u)*2.1);overflow:hidden;text-overflow:ellipsis}
.bowl .bf{display:inline-block;vertical-align:middle;margin-left:calc(var(--u)*.8);color:#ffb27a;font-weight:800;font-size:calc(var(--u)*1.8)}
.balls{display:flex;justify-content:flex-end;gap:calc(var(--u)*.5);margin-top:calc(var(--u)*.3);flex-wrap:nowrap;min-height:calc(var(--u)*2.6)}
.b{font-style:normal;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*1.5);background:rgba(255,255,255,.12);border:calc(var(--u)*.2) solid rgba(255,255,255,.3)}
.b.f{background:var(--c1);color:#00212b;border-color:#7eeaff;box-shadow:0 0 calc(var(--u)*2) var(--c1)}
.b.s{background:var(--c2);color:#00301b;border-color:#9dffc8;box-shadow:0 0 calc(var(--u)*2) var(--c2)}
.b.w{background:var(--hot);color:#fff;border-color:#ff93a6;box-shadow:0 0 calc(var(--u)*2) var(--hot)}
.b.new{animation:newball .9s cubic-bezier(.2,1.6,.3,1)}
.tgt{display:none;gap:calc(var(--u)*.8);align-items:center;margin-top:calc(var(--u)*.3);float:right;padding:calc(var(--u)*.2) calc(var(--u)*1);border-radius:999px;background:rgba(0,210,255,.16);border:calc(var(--u)*.2) solid rgba(0,210,255,.4);font-size:calc(var(--u)*1.6);font-weight:800}
.tgt.on{display:inline-flex}.tgt b{color:var(--c1)}

/* change animations */
.hit{animation:hit .8s cubic-bezier(.2,1.4,.3,1)}
.zoom{animation:zoom 1s cubic-bezier(.2,1.4,.3,1)}
.bump{animation:bump .6s ease}
.fl{position:absolute;bottom:calc(var(--g) + var(--u)*12);font-weight:900;font-size:calc(var(--u)*6);white-space:nowrap;
  text-shadow:0 0 calc(var(--u)*2.5) currentColor,0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.8);
  animation:floatup 1.5s ease-out forwards;pointer-events:none}

/* ---------- BIG CELEBRATION ---------- */
#flash{position:absolute;inset:0;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.1s ease-out}
#big{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#big.show{display:flex}
#bigbox{position:relative;display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*5) calc(var(--u)*9);
  border-radius:calc(var(--u)*6);background:radial-gradient(circle,rgba(0,0,0,.78),rgba(0,0,0,.35));
  border:calc(var(--u)*.4) solid var(--bc,#00d2ff);box-shadow:0 0 calc(var(--u)*10) var(--bc,#00d2ff);
  animation:bigpop 2.6s cubic-bezier(.2,1.2,.3,1) both}
#bigt{font-weight:900;font-size:calc(var(--u)*30);line-height:1;color:var(--bc,#fff);text-shadow:0 0 calc(var(--u)*5) var(--bc,#fff)}
#bigl{font-weight:900;letter-spacing:.3em;font-size:calc(var(--u)*5.5);margin-top:calc(var(--u)*2);color:#fff;text-shadow:0 0 calc(var(--u)*3) var(--bc,#fff)}
.ring{position:absolute;left:50%;top:50%;width:calc(var(--u)*30);height:calc(var(--u)*30);margin:calc(var(--u)*-15) 0 0 calc(var(--u)*-15);
  border-radius:50%;border:calc(var(--u)*.7) solid var(--bc,#00d2ff);opacity:0;animation:ring 1.6s ease-out infinite}
.pt{position:absolute;left:50%;top:50%;font-size:calc(var(--u)*6);opacity:0;animation:burst 1.5s ease-out forwards}

/* ---------- PLAYER / BOWLER CARD ---------- */
/* Centered on screen (horizontally and vertically) with ONE fixed size,
   so batter1, batter2 and bowler cards always occupy exactly the same area.
   Only opacity + transform are animated, so every card uses the same animation. */
#card{position:absolute;
  left:50%;top:50%;
  width:calc(var(--u)*80);max-width:92%;
  /* fixed height, locked with !important so nothing (old inline styles, content size) can change it */
  height:calc(var(--u)*58) !important;min-height:calc(var(--u)*58) !important;max-height:calc(var(--u)*58) !important;
  bottom:auto !important;
  display:flex;flex-direction:column;justify-content:center;
  border-radius:calc(var(--u)*4);padding:calc(var(--u)*3);
  background:linear-gradient(150deg,rgba(4,8,22,.96),rgba(30,10,60,.96));
  border:calc(var(--u)*.3) solid rgba(0,210,255,.55);box-shadow:0 0 calc(var(--u)*7) rgba(0,210,255,.45);
  opacity:0;transform:translate(-50%,-50%) scale(.85);pointer-events:none;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,1.3,.3,1);
  overflow:hidden}
#card.open{opacity:1;transform:translate(-50%,-50%) scale(1)}
#card:before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*.9);
  background:linear-gradient(90deg,var(--c1),var(--vio),var(--c2),var(--c1));background-size:300% 100%;animation:slide 3s linear infinite}
.ch{flex:none;display:flex;align-items:center;gap:calc(var(--u)*2.4);padding-bottom:calc(var(--u)*2);margin-bottom:calc(var(--u)*3);border-bottom:calc(var(--u)*.2) solid rgba(255,255,255,.12)}
.ci{width:calc(var(--u)*10);height:calc(var(--u)*10);flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*5.5);
  background:rgba(0,210,255,.18);border:calc(var(--u)*.3) solid rgba(0,210,255,.6);box-shadow:0 0 calc(var(--u)*3) rgba(0,210,255,.6)}
.cn{flex:1;min-width:0}
.cname{font-weight:900;font-size:calc(var(--u)*5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crole{color:var(--c1);font-weight:800;font-size:calc(var(--u)*2.6);letter-spacing:.2em}
.cbadge{flex:none;padding:calc(var(--u)*.8) calc(var(--u)*2);border-radius:999px;font-weight:900;font-size:calc(var(--u)*2.3);letter-spacing:.1em;
  color:#00301b;background:linear-gradient(90deg,#00ff88,#00d2ff);animation:blink 1.2s infinite}
/* stat grid fills ALL the remaining height of the card: 2 equal rows, so batter and bowler cards look identical */
.sg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--u)*1.6)}
.sb{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:calc(var(--u)*1.8) calc(var(--u)*.6);border-radius:calc(var(--u)*2);background:rgba(255,255,255,.06);
  border:calc(var(--u)*.25) solid var(--c,#00d2ff)}
.sb b{display:block;font-weight:900;font-size:calc(var(--u)*6);color:var(--c,#00d2ff);text-shadow:0 0 calc(var(--u)*2) var(--c,#00d2ff)}
.sb span{display:block;color:#9aa6bd;font-weight:800;font-size:calc(var(--u)*2.3);letter-spacing:.14em;margin-top:calc(var(--u)*.4)}

/* ---------- FULL SCOREBOARD ---------- */
/* Same left/right edges as the score bar. */
#board{position:absolute;z-index:5;
  top:calc(var(--u)*10);
  left:calc(var(--u)*3 + var(--sx,0px));right:calc(var(--u)*3 - var(--sx,0px));
  bottom:calc(var(--g) + var(--u)*14);
  border-radius:calc(var(--u)*4);
  background:linear-gradient(160deg,rgba(4,8,22,.96),rgba(22,10,50,.96));border:calc(var(--u)*.3) solid rgba(0,210,255,.5);
  box-shadow:0 0 calc(var(--u)*8) rgba(0,210,255,.35);padding:calc(var(--u)*3.5);overflow:hidden;
  opacity:0;transform:translateY(8%) scale(.96);pointer-events:none;
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.1)}
#board.open{opacity:1;transform:none}
#board:before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*.9);
  background:linear-gradient(90deg,var(--c1),var(--vio),var(--c2),var(--c1));background-size:300% 100%;animation:slide 3s linear infinite}
#bt{text-align:center;font-weight:900;font-size:calc(var(--u)*4);color:var(--c1);text-shadow:0 0 calc(var(--u)*2) rgba(0,210,255,.7);margin-bottom:calc(var(--u)*2)}
.card{border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.4);margin-bottom:calc(var(--u)*2);background:rgba(255,255,255,.05);border:calc(var(--u)*.2) solid rgba(255,255,255,.1)}
.card .h{display:flex;justify-content:space-between;align-items:center;padding-bottom:calc(var(--u)*1.4);margin-bottom:calc(var(--u)*1);border-bottom:calc(var(--u)*.2) solid rgba(255,255,255,.12)}
.card .h b{font-size:calc(var(--u)*4);font-weight:900}.card .h span{font-size:calc(var(--u)*5.4);font-weight:900;color:var(--c1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.5);padding:calc(var(--u)*1.1) 0;font-size:calc(var(--u)*3);border-bottom:calc(var(--u)*.15) solid rgba(255,255,255,.07)}
.row .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--c1);font-weight:900}.row .x{color:#9aa6bd;font-size:calc(var(--u)*2.4)}
.ov{display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*.9) 0;font-size:calc(var(--u)*2.5);border-bottom:calc(var(--u)*.15) solid rgba(255,255,255,.07)}
.ov .o{width:calc(var(--u)*9);color:#9aa6bd;font-weight:700}.ov .bw{width:calc(var(--u)*16);color:#cbd5e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov .bs{flex:1;display:flex;gap:calc(var(--u)*.7);flex-wrap:wrap}.ov .bs .b{width:calc(var(--u)*4);height:calc(var(--u)*4);font-size:calc(var(--u)*2.2)}
.ov .r{color:var(--c2);font-weight:900}

/* ---------- LANDSCAPE: score bar is 96% wide with 2% margin on each side ---------- */
body.land #dock{left:calc(2% + var(--sx,0px));right:calc(2% - var(--sx,0px))}
body.land #bar{max-width:none;margin-bottom:0.5vh} /* LANDSCAPE: low margin */

/* (the landscape override for #card was removed: the card stays centered on screen) */

/* ---------- LANDSCAPE: compact two-column team board ---------- */
body.land #board{top:calc(var(--u)*5);left:calc(var(--u)*10);right:calc(var(--u)*10);bottom:calc(var(--g) + var(--u)*12);
  padding:calc(var(--u)*2) calc(var(--u)*2.6);
  display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--u)*2.4);align-content:start}
body.land #bt{grid-column:1/-1;font-size:calc(var(--u)*3);margin-bottom:calc(var(--u)*1)}
body.land .card{margin-bottom:0;padding:calc(var(--u)*1.4)}
body.land .card .h{padding-bottom:calc(var(--u)*.7);margin-bottom:calc(var(--u)*.4)}
body.land .card .h b{font-size:calc(var(--u)*2.8)}
body.land .card .h span{font-size:calc(var(--u)*3.6)}
body.land .row{padding:calc(var(--u)*.5) 0;font-size:calc(var(--u)*2.2);flex-wrap:wrap}
body.land .row .x{font-size:calc(var(--u)*1.7)}
body.land .ov{padding:calc(var(--u)*.4) 0;font-size:calc(var(--u)*1.9);gap:calc(var(--u)*.8)}
body.land .ov .o{width:calc(var(--u)*6)}
body.land .ov .bw{width:calc(var(--u)*9)}
body.land .ov .bs{flex-wrap:nowrap}
body.land .ov .bs .b{width:calc(var(--u)*2.8);height:calc(var(--u)*2.8);font-size:calc(var(--u)*1.5)}

/* ---------- KEYFRAMES ---------- */
@keyframes slide{to{background-position:200% 0}}
@keyframes blink{50%{opacity:.25}}
@keyframes rise{from{transform:translateY(120%);opacity:0}}
@keyframes newball{0%{transform:scale(0) rotate(-200deg)}55%{transform:scale(1.7) rotate(10deg);box-shadow:0 0 calc(var(--u)*4) #fff}100%{transform:scale(1) rotate(0)}}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(1.9);color:#fff;text-shadow:0 0 calc(var(--u)*3) #00d2ff,0 0 calc(var(--u)*6) #00d2ff}100%{transform:scale(1)}}
@keyframes zoom{0%{transform:scale(1)}25%{transform:scale(1.55) rotate(-3deg);color:#ffd75e;text-shadow:0 0 calc(var(--u)*4) #ffb020,0 0 calc(var(--u)*8) #ffb020}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.4);color:#fff;text-shadow:0 0 calc(var(--u)*2) #fff}}
@keyframes surge{0%{box-shadow:0 0 calc(var(--u)*5) rgba(0,210,255,.35)}25%{box-shadow:0 0 calc(var(--u)*12) #ffc83d,0 0 calc(var(--u)*20) rgba(255,200,61,.7);border-color:#ffc83d}100%{box-shadow:0 0 calc(var(--u)*5) rgba(0,210,255,.35)}}
@keyframes shake{0%,100%{transform:none}10%{transform:translateX(-3%)}20%{transform:translateX(3%)}30%{transform:translateX(-2.5%)}40%{transform:translateX(2.5%)}55%{transform:translateX(-1.5%)}70%{transform:translateX(1%)}0%{box-shadow:0 0 calc(var(--u)*14) #ff3b5c;border-color:#ff3b5c}50%{box-shadow:0 0 calc(var(--u)*14) #ff3b5c;border-color:#ff3b5c}}
@keyframes sweep{0%{left:-40%;opacity:1}100%{left:120%;opacity:0}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.4)}18%{opacity:1;transform:translate(-50%,calc(var(--u)*-2)) scale(1.35)}100%{opacity:0;transform:translate(-50%,calc(var(--u)*-16)) scale(1)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes bigpop{0%{transform:scale(.1) rotate(-20deg);opacity:0}18%{transform:scale(1.12) rotate(3deg);opacity:1}28%{transform:scale(1) rotate(0)}82%{transform:scale(1);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(220deg);opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <div id="flash"></div>
  <div id="top"><div id="live"><i></i>LIVE</div></div>
  <!-- The logo is loaded by the script below (it tries several URLs and retries), then shown in BOTH portrait and landscape. -->
  <img id="logo" alt="">
  <div id="logoFb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0a1030" stroke="#00d2ff" stroke-width="5"/><text x="50" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="38" fill="#00d2ff">CR</text></svg></div>
  <div id="dock">
    <div id="bar">
      <div class="col">
        <div class="bat" id="r1"><span class="dot" id="d1"></span><span class="nm" id="n1">-</span><span class="rn" id="u1">0</span><span class="bl" id="l1">(0)</span></div>
        <div class="bat" id="r2"><span class="dot" id="d2"></span><span class="nm" id="n2">-</span><span class="rn" id="u2">0</span><span class="bl" id="l2">(0)</span></div>
      </div>
      <div class="col mid">
        <div class="score"><span class="tm" id="tm">TEA</span><span class="sep"></span><span class="sc" id="sc">0/0</span></div>
        <div class="rates"><span class="crr" id="crrw"><b>CRR</b><em id="crr" style="font-style:normal">0.00</em></span><span class="rrr" id="rrrw" style="display:none"><b>RRR</b><em id="rrr" style="font-style:normal">0.00</em></span></div>
      </div>
      <div class="col bowl">
        <div class="lbl">BOWLING</div>
        <div class="bn" id="bn">Bowler</div>
        <div class="balls" id="balls"></div>
        <div class="tgt" id="tgt"><span id="tgtn"></span> <b id="tgts"></b></div>
      </div>
    </div>
  </div>
  <div id="card"></div>
  <div id="big"><div id="bigbox"><div class="ring"></div><div id="bigt"></div><div id="bigl"></div></div></div>
  <div id="board"></div>
  <div id="dbg"></div>
</div>
<script>
(function(){
  var cur = null, pd = null, bigTimer = null, cardTimer = null, boardOpen = false, cardKey = null;
  var lastBalls = '', lastBoard = '', lastCard = '', prevBat = [null, null, null];
  var debug = location.search.indexOf('debug') >= 0;
  /* ---- layout tuning (units of u, about 1% of the screen width in portrait / height in landscape) ---- */
  var GAP_PORTRAIT = 0;       // distance of the score bar from the bottom edge in portrait (0 = touching the bottom, negative = lower)
  var GAP_LANDSCAPE = 0.3;    // same in landscape
  var SHIFT_X_PORTRAIT = 0;   // move the bar right (+) or left (-) in portrait
  var SHIFT_X_LANDSCAPE = 0;  // move the bar right (+) or left (-) in landscape
  var LOGO_EXTRA_RIGHT = 0;   // extra gap (in u) between the icon and the right edge of the score bar (0 = flush with the bar's right edge)
  var CARD_GAP = 1.5;         // gap (in u) between the top of the score bar and the bottom of the full scoreboard
  /* places the logo image is tried from, in this order (the first one that loads wins) */
  /* BEST OPTION: paste your logo here as base64 so it needs no network at all:
     LOGO_DATA = 'data:image/png;base64,AAAA...';   (make it with:  base64 -w0 cr.png ) */
  var LOGO_DATA = '';
  var LOGO_SOURCES = [
    'cr.png',
    'https://rafiullahru.github.io/index/cr.png',
    'https://raw.githubusercontent.com/RafiullahRU/index/refs/heads/main/cr.png'
  ];
  function qp(name){ var m = location.search.match(new RegExp('[?&]' + name + '=(-?[0-9.]+|[a-z]+)')); return m ? m[1] : null; }
  function qn(name, fallback){ var v = parseFloat(qp(name)); return isNaN(v) ? fallback : v; }
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function anim(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function setT(el, v, cls){ v = String(v); if (el.textContent !== v){ el.textContent = v; if (cls) anim(el, cls); return true; } return false; }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  /* ---- always measure the real viewport so the bar stays at the bottom ---- */
  function fit(){
    var w = window.innerWidth || document.documentElement.clientWidth || (screen && screen.width) || 360;
    var h = window.innerHeight || document.documentElement.clientHeight || 0;
    if (h < w * 0.3) h = Math.max((screen && screen.height) || 0, Math.round(w * 16 / 9));
    var st = $('stage'); st.style.width = w + 'px'; st.style.height = h + 'px';
    document.documentElement.style.setProperty('--u', Math.min(w / 100, h * 1.15 / 100) + 'px');
    var o = qp('o'), land = o ? o === 'landscape' : w > h;
    document.body.classList.toggle('land', land);
    var gap = qn('gap', land ? GAP_LANDSCAPE : GAP_PORTRAIT);
    var sx = qn('shift', land ? SHIFT_X_LANDSCAPE : SHIFT_X_PORTRAIT);
    var root = document.documentElement.style;
    root.setProperty('--g', 'calc(var(--u)*' + gap + ')');
    root.setProperty('--sx', 'calc(var(--u)*' + sx + ')');
    if (debug){ $('stage').style.boxShadow = 'inset 0 0 0 4px red'; $('logo').style.outline = '2px solid red'; var d = $('dbg'); d.style.display = 'block'; d.textContent = w + 'x' + h + ' u=' + Math.min(w / 100, h * 1.15 / 100).toFixed(2) + (land ? ' LAND' : ' PORT') + ' gap=' + gap + ' shift=' + sx; }
    placeCards();
  }

  /* ---- keep the full scoreboard a fixed gap above the REAL score bar ----
     offsetTop ignores CSS transforms, so the dock's rise / shake / surge animations
     can never change the measurement.
     NOTE: the player/bowler card (#card) is NOT positioned here any more:
     it is centered on the screen by CSS. */
  function placeCards(){
    var dock = $('dock'), st = $('stage');
    if (!dock || !st) return;
    var u = parseFloat(document.documentElement.style.getPropertyValue('--u')) || 8;
    var fromBottom = st.offsetHeight - dock.offsetTop + u * CARD_GAP;
    $('board').style.bottom = fromBottom + 'px';

    /* align the icon's right edge with the right edge of the score bar.
       offsetLeft/offsetWidth ignore CSS transforms, so bar animations never move it.
       If the measurement is not sane (bar not laid out yet, odd viewport), fall back
       to the fixed CSS margin so the icon can never end up off-screen. */
    var bar = $('bar'), logo = $('logo');
    if (bar && logo){
      var barRight = dock.offsetLeft + bar.offsetLeft + bar.offsetWidth;
      var r = st.offsetWidth - barRight + u * LOGO_EXTRA_RIGHT;
      if (!bar.offsetWidth || !isFinite(r) || r < 0 || r > st.offsetWidth * 0.4) r = u * 3;
      logo.style.right = r + 'px'; var fbEl = $('logoFb'); if (fbEl) fbEl.style.right = r + 'px';
    }
  }

  /* ---- remove a solid background baked into the PNG (only if the corner pixel is opaque) ---- */
  var logoCleaned = false;
  function cleanLogo(){
    var img = $('logo');
    if (logoCleaned || !img.naturalWidth) return;
    logoCleaned = true;
    try{
      var w = img.naturalWidth, h = img.naturalHeight;
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.drawImage(img, 0, 0);
      var id = x.getImageData(0, 0, w, h), p = id.data;
      var r0 = p[0], g0 = p[1], b0 = p[2];
      if (p[3] < 200) return;                      // already transparent, nothing to do
      var seen = new Uint8Array(w * h), stack = [];
      function match(i){ var k = i * 4; return p[k + 3] > 0 && Math.abs(p[k] - r0) + Math.abs(p[k + 1] - g0) + Math.abs(p[k + 2] - b0) <= 60; }
      function push(i){ if (!seen[i] && match(i)){ seen[i] = 1; stack.push(i); } }
      var i2;
      for (i2 = 0; i2 < w; i2++){ push(i2); push((h - 1) * w + i2); }
      for (i2 = 0; i2 < h; i2++){ push(i2 * w); push(i2 * w + w - 1); }
      while (stack.length){
        var i = stack.pop(), cx = i % w, cy = (i - cx) / w;
        p[i * 4 + 3] = 0;
        if (cx > 0) push(i - 1);
        if (cx < w - 1) push(i + 1);
        if (cy > 0) push(i - w);
        if (cy < h - 1) push(i + w);
      }
      /* safety: if the clean-up would erase almost the whole image, keep the original */
      var clear = 0, k;
      for (k = 3; k < p.length; k += 4) if (p[k] === 0) clear++;
      if (clear > w * h * 0.85) return;
      x.putImageData(id, 0, 0);
      img.src = c.toDataURL('image/png');
    }catch(e){ /* if the browser blocks canvas access, the original image is shown as is */ }
  }

  /* ---- logo loader ----
     1) the embedded base64 (if you pasted one), 2) the hosted files, retrying on failure.
     A built-in "CR" badge is shown while the real image is not available, so an icon is ALWAYS visible. */
  (function(){
    var im = $('logo'), fb = $('logoFb'), list = (LOGO_DATA ? [LOGO_DATA] : []).concat(LOGO_SOURCES);
    var idx = 0, tries = 0, ok = false;
    function showFallback(){ if (!ok){ fb.style.display = 'block'; placeCards(); } }
    function load(){
      var s = list[idx];
      var url = s.indexOf('data:') === 0 ? s : s + (s.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
      im.src = url;                                   // no crossOrigin: it can make a normal image fail to load
    }
    im.onload = function(){
      if (!im.naturalWidth) return;
      im.style.display = 'block'; fb.style.display = 'none';
      if (!ok){ ok = true; cleanLogo(); }
      placeCards();
    };
    im.onerror = function(){
      if (ok) return;
      showFallback();
      idx = (idx + 1) % list.length;
      if (++tries < 9) setTimeout(load, tries * 400);
    };
    setTimeout(showFallback, 2500);                   // still nothing after 2.5 s: show the badge
    load();
  })();

  fit(); window.addEventListener('resize', fit); setTimeout(fit, 300); setTimeout(fit, 1500);
  if (window.ResizeObserver) new ResizeObserver(placeCards).observe($('bar'));
  window.addEventListener('resize', placeCards);
  setTimeout(placeCards, 400); setTimeout(placeCards, 1600);

  function ballHtml(r, isNew){
    var c = r === 'W' ? 'w' : r === '6' ? 's' : r === '4' ? 'f' : '';
    return '<i class="b ' + c + (isNew ? ' new' : '') + '">' + esc(r) + '</i>';
  }
  function floatText(text, color, xPct){
    var f = document.createElement('div'); f.className = 'fl'; f.textContent = text;
    f.style.color = color; f.style.left = xPct + '%';
    $('stage').appendChild(f); setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 1600);
  }

  var COL = { '4': '#00d2ff', '6': '#00ff88', 'W': '#ff3b5c' };
  var LBL = { '4': 'FOUR!', '6': 'SIX!', 'W': 'WICKET!', '0': 'DOT BALL' };
  function showBig(r){
    r = String(r);
    var big = $('big'), box = $('bigbox'), c = COL[r] || '#ffd75e';
    var label = LBL[r] || ((r.length === 1 && r >= '1' && r <= '9') ? (r + (r === '1' ? ' RUN' : ' RUNS')) : 'EXTRA');
    box.style.setProperty('--bc', c);
    $('bigt').textContent = r;
    $('bigt').style.fontSize = r.length > 2 ? 'calc(var(--u)*14)' : '';
    $('bigl').textContent = label;
    var old = box.querySelectorAll('.pt'); for (var i = 0; i < old.length; i++) box.removeChild(old[i]);
    var sym = ['★', '🔥', '✦'];
    for (var k = 0; k < 16; k++){
      var p = document.createElement('span'), a = k / 16 * Math.PI * 2, d = 38 + Math.random() * 30;
      p.className = 'pt'; p.textContent = sym[k % 3];
      p.style.setProperty('--dx', (Math.cos(a) * d) + 'vmin');
      p.style.setProperty('--dy', (Math.sin(a) * d) + 'vmin');
      p.style.animationDelay = (0.15 + k * 0.03) + 's';
      box.appendChild(p);
    }
    var fl = $('flash'); fl.style.background = 'radial-gradient(circle,' + c + '66,transparent 70%)';
    anim(fl, 'go');
    big.classList.remove('show'); void big.offsetWidth; big.classList.add('show');
    box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
    clearTimeout(bigTimer); bigTimer = setTimeout(function(){ big.classList.remove('show'); }, 2700);
  }

  /* ---- cards ---- */
  function sb(val, label, color){ return '<div class="sb" style="--c:' + color + '"><b>' + esc(val) + '</b><span>' + label + '</span></div>'; }
  function cardHtml(key){
    var d = cur || {};
    if (key === 'bowl'){
      var w = d.bowler || {}, ov = num(w.overs), balls = Math.floor(ov) * 6 + Math.round((ov % 1) * 10);
      var eco = w.economy != null ? w.economy : (balls > 0 ? (num(w.runs) / (balls / 6)).toFixed(2) : '0.00');
      return '<div class="ch"><div class="ci">🏏</div><div class="cn"><div class="cname">' + esc(w.name || 'Bowler') + '</div><div class="crole">BOWLER</div></div><div class="cbadge" style="visibility:hidden;animation:none">ON STRIKE</div></div>' +
        '<div class="sg">' + sb(w.overs || 0, 'OVERS', '#00d2ff') + sb(w.runs || 0, 'RUNS', '#ffc83d') + sb(w.wickets || 0, 'WICKETS', '#ff3b5c') +
        sb(eco, 'ECONOMY', '#00ff88') + sb((d.currentRunStack || []).length, 'THIS OVER', '#8a7bff') + sb(d.extra && d.extra.total != null ? d.extra.total : 0, 'EXTRAS', '#ff7a3d') + '</div>';
    }
    var b = d[key === 'b2' ? 'batter2' : 'batter1'] || {};
    /* The ON STRIKE badge is ALWAYS rendered (just hidden when not on strike),
       so batter1 and batter2 cards have exactly the same layout, size and area. */
    return '<div class="ch"><div class="ci">👤</div><div class="cn"><div class="cname">' + esc(b.name || 'Batter') + '</div><div class="crole">BATTER</div></div>' +
      '<div class="cbadge" style="' + (b.onStrike ? '' : 'visibility:hidden;animation:none') + '">ON STRIKE</div></div>' +
      '<div class="sg">' + sb(b.run || 0, 'RUNS', '#00d2ff') + sb(b.ball || 0, 'BALLS', '#ffffff') + sb(b.strikeRate || '0.00', 'STRIKE RATE', '#ffc83d') +
      sb(b.four || 0, 'FOURS', '#00ff88') + sb(b.six || 0, 'SIXES', '#ff7a3d') + sb(b.onStrike ? 'Striker' : 'Not Out', 'STATUS', '#8a7bff') + '</div>';
  }
  function hideCards(){ cardKey = null; clearTimeout(cardTimer); $('card').classList.remove('open'); }
  function showCard(key){
    if (!cur) return;
    var el = $('card');
    if (cardKey === key && el.classList.contains('open')){ hideCards(); return; }
    cardKey = key; lastCard = cardHtml(key); el.innerHTML = lastCard;
    if (boardOpen) window.toggleBoard(false);
    el.classList.remove('open'); void el.offsetWidth;
    el.classList.add('open');
    clearTimeout(cardTimer); cardTimer = setTimeout(hideCards, 7000);
  }

  function renderBoard(d){
    var inn2 = !!d.team2score;
    var team = inn2 ? d.team2 : d.team1, score = inn2 ? d.team2score : d.team1score;
    function line(b){ b = b || {}; return '<div class="row"><span class="n">' + (b.onStrike ? '⚡ ' : '') + esc(b.name || '-') +
      '</span><span class="s">' + esc(b.run || 0) + ' (' + esc(b.ball || 0) + ')</span><span class="x">SR ' + esc(b.strikeRate || '0.00') +
      ' • 4s ' + esc(b.four || 0) + ' • 6s ' + esc(b.six || 0) + '</span></div>'; }
    var ov = (d.recentOvers || []).map(function(o){
      return '<div class="ov"><span class="o">Over ' + esc(o.overNo) + '</span><span class="bw">' + esc(o.bowler || '-') +
        '</span><span class="bs">' + (o.stack || []).map(function(x){ return ballHtml(x, false); }).join('') + '</span><span class="r">' + esc(o.runs || 0) + '</span></div>';
    }).join('');
    var html = '<div id="bt">' + esc(d.matchs || 'Live Match') + '</div>' +
      '<div class="card"><div class="h"><b>' + esc(team) + '</b><span>' + esc(score) + '</span></div>' + line(d.batter1) + line(d.batter2) + '</div>' +
      '<div class="card"><div class="h"><b style="font-size:calc(var(--u)*3.2);color:#9aa6bd">RECENT OVERS</b></div>' + (ov || '<div class="row"><span class="x">No overs yet</span></div>') + '</div>';
    if (html !== lastBoard){ lastBoard = html; $('board').innerHTML = html; }
  }

  /* ---- main update: only touches what actually changed ---- */
  window.updateScore = function(d){
    if (!d) return;
    cur = d;
    var inn2 = !!d.team2score || d.inningNo === 2;
    var team = d.team2score ? d.team2 : d.team1;
    var score = d.team2score || d.team1score || '0/0';
    var stack = d.currentRunStack || [];
    var last = stack.length ? stack[stack.length - 1] : null;
    var parts = String(score).split('/');
    var runs = parseInt(parts[0], 10) || 0, wk = parseInt(parts[1], 10) || 0;
    var teamKey = String(team || '') + '|' + (d.inningNo || '');
    var bw = d.bowler || {};

    // batters
    var xs = [0, 14, 14];
    for (var i = 1; i <= 2; i++){
      var b = d['batter' + i] || {};
      $('r' + i).classList.toggle('strike', !!b.onStrike);
      $('d' + i).textContent = b.onStrike ? '●' : '○';
      $('n' + i).textContent = b.name || '-';
      var nr = parseInt(b.run, 10) || 0, pb = prevBat[i];
      if (pb && pb.name === b.name && nr > pb.run){
        anim($('u' + i), 'hit'); floatText('+' + (nr - pb.run), '#00d2ff', xs[i]);
      }
      $('u' + i).textContent = nr;
      $('l' + i).textContent = '(' + (b.ball || 0) + ')';
      prevBat[i] = { name: b.name, run: nr };
    }

    // team score
    $('tm').textContent = String(team || 'TEAM').slice(0, 3).toUpperCase();
    if (pd && pd.teamKey === teamKey){
      if (runs > pd.runs){
        anim($('sc'), 'zoom'); anim($('bar'), 'surge');
        floatText('+' + (runs - pd.runs), '#ffd75e', 50);
      }
      if (wk > pd.wk){ anim($('bar'), 'shake'); anim($('flash'), 'go'); $('flash').style.background = 'radial-gradient(circle,#ff3b5c88,transparent 70%)'; }
    }
    $('sc').textContent = score;
    setT($('crr'), d.crr || '0.00', 'bump');
    $('rrrw').style.display = inn2 ? '' : 'none';
    setT($('rrr'), d.rrr || '0.00', 'bump');

    // bowler
    $('bn').textContent = bw.name || 'Bowler';
    var bruns = parseInt(bw.runs, 10) || 0;
    if (pd && pd.bowlName === bw.name && bruns > pd.bowlRuns) floatText('+' + (bruns - pd.bowlRuns), '#ff7a3d', 86);

    var arr = stack.slice(-6), key = arr.join(',') + '|' + stack.length;
    if (key !== lastBalls){
      var grew = !!pd && stack.length > pd.len;
      $('balls').innerHTML = arr.map(function(r, k){ return ballHtml(r, grew && k === arr.length - 1); }).join('');
      lastBalls = key;
    }

    var tg = $('tgt'); tg.classList.toggle('on', inn2);
    $('tgtn').textContent = String(d.team1 || '').slice(0, 3).toUpperCase(); $('tgts').textContent = d.team1score || '0/0';

    renderBoard(d);
    if (cardKey){ var h = cardHtml(cardKey); if (h !== lastCard){ lastCard = h; $('card').innerHTML = h; } }

    // celebration for a new boundary / wicket
    if (pd && stack.length > pd.len && COL[last]) showBig(last);

    placeCards();
    pd = { len: stack.length, runs: runs, wk: wk, teamKey: teamKey, bowlRuns: bruns, bowlName: bw.name };
  };

  window.setLive = function(on){ $('live').classList.toggle('on', !!on); };
  window.toggleBoard = function(force){
    placeCards();
    boardOpen = typeof force === 'boolean' ? force : !boardOpen;
    if (boardOpen) hideCards();
    $('board').classList.toggle('open', boardOpen);
  };
  window.showPlayer = function(n){ showCard(n === 2 ? 'b2' : 'b1'); };
  window.showBowler = function(){ showCard('bowl'); };
  window.showLastBall = function(){
    var s = cur && cur.currentRunStack || [];
    if (s.length) showBig(s[s.length - 1]); else floatText('No balls yet', '#ffffff', 50);
  };
  window.hideCards = hideCards;
  window.__overlayReady = true;
})();
</script>
</body>
</html>
