<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>overlay-video</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
  /* layer 0: the camera feed (received from the app over a local WebRTC loopback) */
  #vid{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0}
  /* layer 1: your existing overlay.html, transparent, same size */
  #ov{position:fixed;left:0;top:0;width:100%;height:100%;border:0;background:transparent;z-index:1}
  /* hide the WebView's default grey "play" poster / controls */
  #cv{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0;display:none}
  #vid::-webkit-media-controls{display:none !important}
  #vid::-webkit-media-controls-start-playback-button{display:none !important;-webkit-appearance:none}
  #vid::-webkit-media-controls-overlay-play-button{display:none !important}
  #dbgv{position:fixed;left:6px;bottom:6px;z-index:9;font:12px monospace;color:#0f0;background:rgba(0,0,0,.65);padding:2px 6px;display:none}
</style>
</head>
<body>
<video id="vid" autoplay muted playsinline disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
<canvas id="cv"></canvas>
<div id="dbgv"></div>
<iframe id="ov" allowtransparency="true" scrolling="no"></iframe>

<script>
(function(){
  /* ---------- 1) load overlay.html (same folder) with the SAME query string (?o=landscape&w=..&h=..) ---------- */
  var ov = document.getElementById('ov');
  ov.src = 'overlay.html' + location.search;

  /* ---------- 2) forward every overlay function to the iframe ----------
     The app calls window.updateScore(...), window.toggleBoard(...), etc. on THIS page.
     We pass them straight to overlay.html inside the iframe. */
  ['updateScore','setLive','toggleBoard','showPlayer','showBowler','showLastBall','hideCards'].forEach(function(name){
    window[name] = function(){
      try {
        var w = ov.contentWindow;
        if (w && typeof w[name] === 'function') return w[name].apply(w, arguments);
      } catch (e) {}
    };
  });

  /* ---------- 3) receive the video from the app ---------- */
  var pc = null, vid = document.getElementById('vid'), dbgv = document.getElementById('dbgv');
  if (location.search.indexOf('debug') >= 0) dbgv.style.display = 'block';
  function dbg(t){ dbgv.textContent = t; }
  /* keep trying to play: some WebViews pause a MediaStream until the first frame */
  function kick(){ var p = vid.play(); if (p && p.catch) p.catch(function(){}); }
  vid.addEventListener('loadedmetadata', kick);
  vid.addEventListener('canplay', kick);
  vid.addEventListener('pause', function(){ if (vid.srcObject) kick(); });
  var isPlaying = false, canvasToken = 0, cv = document.getElementById('cv');
  vid.addEventListener('playing', function(){ isPlaying = true; dbg('playing ' + vid.videoWidth + 'x' + vid.videoHeight); });
  /* any tap on the page also tries to start the video (harmless if it already plays) */
  ['touchstart','click'].forEach(function(n){ document.addEventListener(n, kick, true); });

  /* AUTOPLAY FALLBACK: if the WebView refuses to autoplay the <video> (this is what shows the play icon),
     read the frames directly from the video track and paint them on a canvas.
     Canvas drawing is not covered by the autoplay rules, so no tap is needed. */
  function startCanvas(track){
    if (!window.MediaStreamTrackProcessor) { dbg('autoplay blocked, no canvas fallback'); return false; }
    var token = ++canvasToken;
    var reader = new MediaStreamTrackProcessor({ track: track }).readable.getReader();
    var ctx = cv.getContext('2d');
    vid.style.display = 'none'; cv.style.display = 'block';
    dbg('canvas mode');
    (function loop(){
      reader.read().then(function(r){
        if (r.done || token !== canvasToken) { if (r.value) r.value.close(); return; }
        var f = r.value;
        if (cv.width !== f.displayWidth || cv.height !== f.displayHeight){ cv.width = f.displayWidth; cv.height = f.displayHeight; }
        ctx.drawImage(f, 0, 0); f.close(); loop();
      }).catch(function(){});
    })();
    return true;
  }
  function stopCanvas(){ canvasToken++; cv.style.display = 'none'; vid.style.display = 'block'; }

  function post(o){
    try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(o)); } catch (e) {}
  }

  window.rtcOffer = async function(sdp){
    try {
      if (pc) { try { pc.close(); } catch (e) {} }
      pc = new RTCPeerConnection({ iceServers: [] });           // same phone: no STUN/TURN needed
      pc.ontrack = function(e){
        vid.srcObject = (e.streams && e.streams[0]) || new MediaStream([e.track]);
        isPlaying = false; stopCanvas();
        kick(); dbg('track received');
        var trk = e.track;
        /* if the <video> has not started by itself after 1.2 s, switch to the canvas path */
        setTimeout(function(){ if (!isPlaying && pc) startCanvas(trk); }, 1200);
        post({ t: 'track' });
      };
      pc.oniceconnectionstatechange = function(){ dbg('ice ' + pc.iceConnectionState); post({ t: 'ice', s: pc.iceConnectionState }); };
      await pc.setRemoteDescription({ type: 'offer', sdp: sdp });
      var ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await new Promise(function(res){
        if (pc.iceGatheringState === 'complete') return res();
        pc.onicegatheringstatechange = function(){ if (pc.iceGatheringState === 'complete') res(); };
        setTimeout(res, 2000);
      });
      post({ t: 'answer', sdp: pc.localDescription.sdp });
    } catch (err) { post({ t: 'err', m: String((err && err.message) || err) }); }
  };

  window.rtcClose = function(){
    try { if (pc) pc.close(); } catch (e) {}
    pc = null; vid.srcObject = null; isPlaying = false; stopCanvas();
  };

  window.__overlayVideoReady = true;
  dbg('page ready');
  post({ t: 'hello' });   // tells the app the page is loaded and messages work
})();
</script>
</body>
</html>
