<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
:root{--u:min(1vw,1.15vh);--c1:#00d2ff;--c2:#00ff88;--hot:#ff3b5c;--gold:#ffc83d;--vio:#8a2be2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;color:#fff;
  font-family:-apple-system,"SF Pro Display",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- TOP STRIP ---------- */
#top{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3);right:calc(var(--u)*3);
  display:flex;align-items:center;gap:calc(var(--u)*2)}
#live{display:none;align-items:center;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1) calc(var(--u)*2.4);
  border-radius:999px;font-weight:900;letter-spacing:.12em;font-size:calc(var(--u)*3);
  background:linear-gradient(135deg,#ff2d55,#b00020);box-shadow:0 0 calc(var(--u)*4) rgba(255,45,85,.7)}
#live.on{display:flex}
#live i{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:#fff;animation:blink 1s infinite}
#title{flex:1;min-width:0;text-align:center;font-weight:800;font-size:calc(var(--u)*3.1);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:calc(var(--u)*1) calc(var(--u)*2.6);
  border-radius:999px;background:rgba(6,10,24,.72);border:calc(var(--u)*.25) solid rgba(0,210,255,.35);
  text-shadow:0 0 calc(var(--u)*2) rgba(0,210,255,.8)}
#title:empty{display:none}

/* ---------- MESSAGE TICKER ---------- */
#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*30);max-width:92%;
  padding:calc(var(--u)*1.2) calc(var(--u)*3.2);border-radius:999px;font-weight:800;
  font-size:calc(var(--u)*3.2);color:#1a1200;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#ffd75e,#ffb020,#ffd75e);background-size:200% 100%;
  box-shadow:0 0 calc(var(--u)*4) rgba(255,176,32,.6);animation:slide 4s linear infinite;display:none}
#msg.on{display:block}

/* ---------- SCORE BAR ---------- */
#bar{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*4);
  display:grid;grid-template-columns:1.3fr 1.05fr .95fr;align-items:center;gap:calc(var(--u)*1.5);
  padding:calc(var(--u)*2.4) calc(var(--u)*2.4) calc(var(--u)*2);border-radius:calc(var(--u)*4);
  background:linear-gradient(135deg,rgba(6,10,26,.93),rgba(24,10,54,.93));
  border:calc(var(--u)*.3) solid rgba(0,210,255,.5);
  box-shadow:0 0 calc(var(--u)*5) rgba(0,210,255,.35),0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.6);
  overflow:hidden;animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
#bar:before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*.8);
  background:linear-gradient(90deg,var(--c1),var(--vio),var(--c2),var(--c1));background-size:300% 100%;animation:slide 3s linear infinite}
.col{min-width:0}
.bat{display:flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.6) calc(var(--u)*1);
  border-radius:calc(var(--u)*1.2);font-size:calc(var(--u)*3);white-space:nowrap}
.bat.strike{background:linear-gradient(90deg,rgba(0,210,255,.28),rgba(0,210,255,0))}
.bat .dot{width:calc(var(--u)*1.4);color:var(--c1);font-size:calc(var(--u)*2)}
.bat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bat .rn{font-weight:900;color:var(--c1);font-size:calc(var(--u)*3.6)}
.bat .bl{color:#9aa6bd;font-size:calc(var(--u)*2.4)}
.mid{text-align:center}
.score{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2)}
.tm{font-weight:900;font-size:calc(var(--u)*4.2);color:var(--c1);letter-spacing:.06em;text-shadow:0 0 calc(var(--u)*2) rgba(0,210,255,.8)}
.sep{width:calc(var(--u)*.3);height:calc(var(--u)*5);background:linear-gradient(var(--c1),var(--vio));border-radius:2px}
.sc{font-weight:900;font-size:calc(var(--u)*6.6);line-height:1;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*2) rgba(0,0,0,.6)}
.rates{display:flex;justify-content:center;gap:calc(var(--u)*3);margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*2.8);font-weight:800}
.rates span b{color:#9aa6bd;font-size:calc(var(--u)*2.3);margin-right:calc(var(--u)*.8);letter-spacing:.08em}
.rates .crr{color:var(--c1)} .rates .rrr{color:#ff7a3d}
.bowl .bn{font-weight:800;font-size:calc(var(--u)*3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bowl .lbl{font-size:calc(var(--u)*2.1);color:#9aa6bd;text-align:right;letter-spacing:.14em;font-weight:700}
.balls{display:flex;justify-content:flex-end;gap:calc(var(--u)*.8);margin-top:calc(var(--u)*1);flex-wrap:nowrap}
.b{font-style:normal;width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*2.5);
  background:rgba(255,255,255,.12);border:calc(var(--u)*.2) solid rgba(255,255,255,.3);animation:pop .4s ease both}
.b.f{background:var(--c1);color:#00212b;border-color:#7eeaff;box-shadow:0 0 calc(var(--u)*2) var(--c1)}
.b.s{background:var(--c2);color:#00301b;border-color:#9dffc8;box-shadow:0 0 calc(var(--u)*2) var(--c2)}
.b.w{background:var(--hot);color:#fff;border-color:#ff93a6;box-shadow:0 0 calc(var(--u)*2) var(--hot)}
.tgt{display:inline-flex;gap:calc(var(--u)*1);align-items:center;margin-top:calc(var(--u)*1);float:right;
  padding:calc(var(--u)*.6) calc(var(--u)*1.6);border-radius:999px;background:rgba(0,210,255,.16);
  border:calc(var(--u)*.2) solid rgba(0,210,255,.4);font-size:calc(var(--u)*2.4);font-weight:800}
.tgt b{color:var(--c1)}
.bump{animation:bump .5s ease}

/* ---------- BIG RUN ---------- */
#flash{position:absolute;inset:0;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.1s ease-out}
#big{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#big.show{display:flex}
#bigbox{position:relative;display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*5) calc(var(--u)*9);
  border-radius:calc(var(--u)*6);background:radial-gradient(circle,rgba(0,0,0,.78),rgba(0,0,0,.35));
  border:calc(var(--u)*.4) solid var(--bc,#00d2ff);box-shadow:0 0 calc(var(--u)*10) var(--bc,#00d2ff);
  animation:bigpop 2.6s cubic-bezier(.2,1.2,.3,1) both}
#bigt{font-weight:900;font-size:calc(var(--u)*30);line-height:1;color:var(--bc,#fff);text-shadow:0 0 calc(var(--u)*5) var(--bc,#fff)}
#bigl{font-weight:900;letter-spacing:.3em;font-size:calc(var(--u)*5.5);margin-top:calc(var(--u)*2);color:#fff;text-shadow:0 0 calc(var(--u)*3) var(--bc,#fff)}
.ring{position:absolute;left:50%;top:50%;width:calc(var(--u)*30);height:calc(var(--u)*30);margin:calc(var(--u)*-15) 0 0 calc(var(--u)*-15);
  border-radius:50%;border:calc(var(--u)*.7) solid var(--bc,#00d2ff);opacity:0;animation:ring 1.6s ease-out infinite}
.pt{position:absolute;left:50%;top:50%;font-size:calc(var(--u)*6);opacity:0;animation:burst 1.5s ease-out forwards}

/* ---------- FULL SCOREBOARD ---------- */
#board{position:absolute;z-index:5;inset:calc(var(--u)*10) calc(var(--u)*4) calc(var(--u)*30);border-radius:calc(var(--u)*4);
  background:linear-gradient(160deg,rgba(4,8,22,.96),rgba(22,10,50,.96));border:calc(var(--u)*.3) solid rgba(0,210,255,.5);
  box-shadow:0 0 calc(var(--u)*8) rgba(0,210,255,.35);padding:calc(var(--u)*3.5);overflow:hidden;
  opacity:0;transform:translateY(8%) scale(.96);pointer-events:none;transition:all .5s cubic-bezier(.2,.9,.3,1.1)}
#board.open{opacity:1;transform:none}
#board:before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*.9);
  background:linear-gradient(90deg,var(--c1),var(--vio),var(--c2),var(--c1));background-size:300% 100%;animation:slide 3s linear infinite}
#bt{text-align:center;font-weight:900;font-size:calc(var(--u)*4);color:var(--c1);text-shadow:0 0 calc(var(--u)*2) rgba(0,210,255,.7)}
#bm{text-align:center;color:var(--c2);font-weight:700;font-size:calc(var(--u)*2.8);margin:calc(var(--u)*.8) 0 calc(var(--u)*2)}
.card{border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.4);margin-bottom:calc(var(--u)*2);background:rgba(255,255,255,.05);border:calc(var(--u)*.2) solid rgba(255,255,255,.1)}
.card .h{display:flex;justify-content:space-between;align-items:center;padding-bottom:calc(var(--u)*1.4);margin-bottom:calc(var(--u)*1);border-bottom:calc(var(--u)*.2) solid rgba(255,255,255,.12)}
.card .h b{font-size:calc(var(--u)*4);font-weight:900}.card .h span{font-size:calc(var(--u)*5.4);font-weight:900;color:var(--c1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.5);padding:calc(var(--u)*1.1) 0;font-size:calc(var(--u)*3);border-bottom:calc(var(--u)*.15) solid rgba(255,255,255,.07)}
.row .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--c1);font-weight:900}.row .x{color:#9aa6bd;font-size:calc(var(--u)*2.4)}
.ov{display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*.9) 0;font-size:calc(var(--u)*2.5);border-bottom:calc(var(--u)*.15) solid rgba(255,255,255,.07)}
.ov .o{width:calc(var(--u)*9);color:#9aa6bd;font-weight:700}.ov .bw{width:calc(var(--u)*16);color:#cbd5e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov .bs{flex:1;display:flex;gap:calc(var(--u)*.7);flex-wrap:wrap}.ov .bs .b{width:calc(var(--u)*4);height:calc(var(--u)*4);font-size:calc(var(--u)*2.2)}
.ov .r{color:var(--c2);font-weight:900}
@media (orientation:landscape){#board{inset:calc(var(--u)*9) 18% calc(var(--u)*22);overflow:auto}}

/* ---------- ANIMATIONS ---------- */
@keyframes slide{to{background-position:200% 0}}
@keyframes blink{50%{opacity:.25}}
@keyframes rise{from{transform:translateY(120%);opacity:0}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bump{40%{transform:scale(1.25);color:#fff}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes bigpop{0%{transform:scale(.1) rotate(-20deg);opacity:0}18%{transform:scale(1.12) rotate(3deg);opacity:1}28%{transform:scale(1) rotate(0)}82%{transform:scale(1);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(220deg);opacity:0}}
</style>
</head>
<body>
<div id="flash"></div>
<div id="top"><div id="live"><i></i>LIVE</div><div id="title"></div></div>
<div id="msg"></div>
<div id="bar">
  <div class="col" id="bats"></div>
  <div class="col mid">
    <div class="score"><span class="tm" id="tm">TEA</span><span class="sep"></span><span class="sc" id="sc">0/0</span></div>
    <div class="rates" id="rates"></div>
  </div>
  <div class="col bowl" id="bowl"></div>
</div>
<div id="big"><div id="bigbox"><div class="ring"></div><div id="bigt"></div><div id="bigl"></div></div></div>
<div id="board"></div>
<script>
(function(){
  var prev = null, boardOpen = false, bigTimer = null;
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ball(r){ var c = r === 'W' ? 'w' : r === '6' ? 's' : r === '4' ? 'f' : ''; return '<i class="b ' + c + '">' + esc(r) + '</i>'; }
  function setText(id, v){
    var el = $(id); v = String(v);
    if (el.textContent !== v){
      el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
  }
  function batRow(b){
    b = b || {};
    return '<div class="bat' + (b.onStrike ? ' strike' : '') + '"><span class="dot">' + (b.onStrike ? '\u25CF' : '\u25CB') +
      '</span><span class="nm">' + esc(b.name || '-') + '</span><span class="rn">' + esc(b.run || 0) +
      '</span><span class="bl">(' + esc(b.ball || 0) + ')</span></div>';
  }
  var COL = { '4': '#00d2ff', '6': '#00ff88', 'W': '#ff3b5c' };
  var LBL = { '4': 'FOUR!', '6': 'SIX!', 'W': 'WICKET!' };

  function showBig(r){
    var big = $('big'), box = $('bigbox'), c = COL[r];
    box.style.setProperty('--bc', c);
    $('bigt').textContent = r;
    $('bigl').textContent = LBL[r];
    var old = box.querySelectorAll('.pt'); for (var i = 0; i < old.length; i++) box.removeChild(old[i]);
    var sym = ['\u2605', '\uD83D\uDD25', '\u2726'];
    for (var k = 0; k < 16; k++){
      var p = document.createElement('span'), a = k / 16 * Math.PI * 2, d = 38 + Math.random() * 30;
      p.className = 'pt'; p.textContent = sym[k % 3];
      p.style.setProperty('--dx', (Math.cos(a) * d) + 'vmin');
      p.style.setProperty('--dy', (Math.sin(a) * d) + 'vmin');
      p.style.animationDelay = (0.15 + k * 0.03) + 's';
      box.appendChild(p);
    }
    var fl = $('flash'); fl.style.background = 'radial-gradient(circle,' + c + '66,transparent 70%)';
    fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    big.classList.remove('show'); void big.offsetWidth; big.classList.add('show');
    box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
    clearTimeout(bigTimer); bigTimer = setTimeout(function(){ big.classList.remove('show'); }, 2700);
  }

  function renderBoard(d){
    var inn2 = !!d.team2score;
    var team = inn2 ? d.team2 : d.team1, score = inn2 ? d.team2score : d.team1score;
    function line(b){ b = b || {}; return '<div class="row"><span class="n">' + (b.onStrike ? '\u26A1 ' : '') + esc(b.name || '-') +
      '</span><span class="s">' + esc(b.run || 0) + ' (' + esc(b.ball || 0) + ')</span><span class="x">SR ' + esc(b.strikeRate || '0.00') +
      ' \u2022 4s ' + esc(b.four || 0) + ' \u2022 6s ' + esc(b.six || 0) + '</span></div>'; }
    var ov = (d.recentOvers || []).map(function(o){
      return '<div class="ov"><span class="o">Over ' + esc(o.overNo) + '</span><span class="bw">' + esc(o.bowler || '-') +
        '</span><span class="bs">' + (o.stack || []).map(ball).join('') + '</span><span class="r">' + esc(o.runs || 0) + '</span></div>';
    }).join('');
    $('board').innerHTML = '<div id="bt">' + esc(d.matchs || 'Live Match') + '</div><div id="bm">' + esc(d.winningMessage || '') + '</div>' +
      '<div class="card"><div class="h"><b>' + esc(team) + '</b><span>' + esc(score) + '</span></div>' + line(d.batter1) + line(d.batter2) + '</div>' +
      '<div class="card"><div class="h"><b style="font-size:calc(var(--u)*3.2);color:#9aa6bd">RECENT OVERS</b></div>' + (ov || '<div class="row"><span class="x">No overs yet</span></div>') + '</div>';
  }

  window.updateScore = function(d){
    if (!d) return;
    var inn2 = !!d.team2score || d.inningNo === 2;
    var team = d.team2score ? d.team2 : d.team1;
    var score = d.team2score || d.team1score || '0/0';
    var stack = d.currentRunStack || [];
    var last = stack.length ? stack[stack.length - 1] : null;

    $('title').textContent = d.matchs || '';
    $('bats').innerHTML = batRow(d.batter1) + batRow(d.batter2);
    $('tm').textContent = String(team || 'TEAM').slice(0, 3).toUpperCase();
    setText('sc', score);
    $('rates').innerHTML = inn2
      ? '<span class="crr"><b>CRR</b>' + esc(d.crr || '0.00') + '</span><span class="rrr"><b>RRR</b>' + esc(d.rrr || '0.00') + '</span>'
      : '<span class="crr"><b>CRR</b>' + esc(d.crr || '0.00') + '</span>';
    $('bowl').innerHTML = '<div class="lbl">BOWLING</div><div class="bn">' + esc((d.bowler && d.bowler.name) || 'Bowler') + '</div>' +
      '<div class="balls">' + stack.slice(-6).map(ball).join('') + '</div>' +
      (inn2 ? '<div class="tgt">' + esc(String(d.team1 || '').slice(0, 3).toUpperCase()) + ' <b>' + esc(d.team1score || '0/0') + '</b></div>' : '');

    var m = $('msg'); m.textContent = d.winningMessage || ''; m.classList.toggle('on', !!d.winningMessage);
    renderBoard(d);

    var sig = stack.length + '|' + last + '|' + score;
    if (prev && sig !== prev.sig && stack.length > prev.len && COL[last]) showBig(last);
    prev = { sig: sig, len: stack.length };
  };
  window.setLive = function(on){ $('live').classList.toggle('on', !!on); };
  window.toggleBoard = function(force){
    boardOpen = typeof force === 'boolean' ? force : !boardOpen;
    $('board').classList.toggle('open', boardOpen);
  };
  window.__overlayReady = true;
})();
</script>
</body>
</html>
